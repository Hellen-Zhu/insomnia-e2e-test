# 建仓数据（trade 模块）——只放会变的业务参数。
# productType 是固定枚举、直接绑定 .dat 路径（代码级映射，见 trade-cases.ts），
# 由场景步骤声明，不在此维护。
#
# 两个命名空间，按数据角色分开（同一种数据的两个视角，放同一文件）：
# - trade_preset: 业务别名 → 参数模板。用于「建仓只是前置条件/数据细节与被测行为
#   无关」的场景（Given a "FX_TRF" trade has been created），与 caseId 无关，可复用；
#   顶层键即命名空间（<kind>_preset），别名只需在本命名空间内唯一
# - cases: caseId → 参数。用于「建仓本身是被测行为」的场景，
#   经场景标题（"TRADE-001 - ..." 或 "[TRADE-001] ..."）绑定
#
# caseId 编号：TRADE-<三位流水号>。模块前缀即命名空间（product 模块用 PRODUCT-xxx），
# 跨模块不会撞号；号码只增不改不复用，接入 ADO 后机械替换为 work item ID。
# stepIn 可选：mode = full | partial，counterparty 为 step-in 对手方
#（映射 create-trade-old-counterparty-combobox）。
#
# 用例攒多后：把本文件原地升级为同名目录（create-trade-cases/），按功能面拆分片
# （core.yaml、stepin.yaml…），每个分片仍是 presets + cases 同文件；全局索引扫描
# 整棵 test-data/ 目录树并检测跨文件重复 key，文件怎么拆取数代码零改动。
# 注意锚点不跨文件——继承链留在同一分片内，
# 但同一文件内可以跨命名空间引用（TRADE-004/005 复用 trade_preset 的 &base）。

# preset 编排：同一形状的变体共用命名空间，公共字段经锚点继承（&base / <<:），
# 变体只声明自己的差异——改基线对手方一处，三个 preset 同步生效。
trade_preset:
  standard: &base
    counterparty: ACME Bank
    portfolio: FX Derivatives

  stepin-full:
    <<: *base
    stepIn:
      mode: full
      counterparty: Initech

  stepin-partial:
    <<: *base
    stepIn:
      mode: partial
      counterparty: Initech

cases:
  # Outline 覆盖产品类型：caseId 这一列本身就让每行标题可追溯、报告不去重，
  # 其余字段该怎么变就怎么变——不需要（也不应该）强行造成一样
  TRADE-001:
    counterparty: ACME Bank
    portfolio: FX Derivatives

  TRADE-002:
    counterparty: Globex
    portfolio: FX Options

  TRADE-003:
    counterparty: Wayne Enterprises
    portfolio: FX Options

  # step-in 两个模式各自独立成场景（不进 Outline）：它们验证的是 step-in 流程本身，
  # 不是产品类型差异，固定用 FX_FBS 即可
  TRADE-004:
    <<: *base
    stepIn:
      mode: full
      counterparty: Initech

  TRADE-005:
    <<: *base
    stepIn:
      mode: partial
      counterparty: Initech
